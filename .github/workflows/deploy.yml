name: Dev-Build-Test-Deploy S3 Bucket via CloudFormation

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy-dev:
    name: Deploy (dev)
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROC_AROLE_CFORMATION_S3 }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name ${{ vars.ENVIRONMENT }}-${{ vars.STACK_NAME }} \
            --region ${{ vars.AWS_REGION }} \
            --parameter-overrides Environment=${{ vars.ENVIRONMENT }} \
            --no-fail-on-empty-changeset

      - name: Verify S3 bucket exists
        run: |
          aws s3api head-bucket --bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }}
          echo "Bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }} verified."

  deploy-stage:
    name: Deploy (stage)
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROC_AROLE_CFORMATION_S3 }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name ${{ vars.ENVIRONMENT }}-${{ vars.STACK_NAME }} \
            --region ${{ vars.AWS_REGION }} \
            --parameter-overrides Environment=${{ vars.ENVIRONMENT }} \
            --no-fail-on-empty-changeset

      - name: Verify S3 bucket exists
        run: |
          aws s3api head-bucket --bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }}
          echo "Bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }} verified."

  deploy-uat:
    name: Deploy (uat)
    needs: deploy-stage
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROC_AROLE_CFORMATION_S3 }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name ${{ vars.ENVIRONMENT }}-${{ vars.STACK_NAME }} \
            --region ${{ vars.AWS_REGION }} \
            --parameter-overrides Environment=${{ vars.ENVIRONMENT }} \
            --no-fail-on-empty-changeset

      - name: Verify S3 bucket exists
        run: |
          aws s3api head-bucket --bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }}
          echo "Bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }} verified."

  deploy-prod:
    name: Deploy (prod)
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROC_AROLE_CFORMATION_S3 }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name ${{ vars.ENVIRONMENT }}-${{ vars.STACK_NAME }} \
            --region ${{ vars.AWS_REGION }} \
            --parameter-overrides Environment=${{ vars.ENVIRONMENT }} \
            --no-fail-on-empty-changeset

      - name: Verify S3 bucket exists
        run: |
          aws s3api head-bucket --bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }}
          echo "Bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }} verified."
