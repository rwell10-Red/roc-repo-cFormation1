name: Dev-Build-Test-Deploy S3 Bucket via CloudFormation

on:
  push:
    branches:
      - dev
  pull_request:
    types: [closed]
    branches:
      - stage
      - uat
      - prod

permissions:
  id-token: write
  contents: read

jobs:
  detect-environment:
    name: Detect Environment
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - name: Detect Target Environment
        id: detect
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.base.ref }}" == "stage" ]]; then
            echo "environment=stage" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.base.ref }}" == "uat" ]]; then
            echo "environment=uat" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.base.ref }}" == "prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build
    needs: detect-environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy (${{ needs.detect-environment.outputs.environment }})
    needs: [detect-environment, test]
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROC_AROLE_CFORMATION_S3 }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name ${{ vars.ENVIRONMENT }}-${{ vars.STACK_NAME }} \
            --region ${{ vars.AWS_REGION }} \
            --parameter-overrides Environment=${{ vars.ENVIRONMENT }} \
            --no-fail-on-empty-changeset

      - name: Verify S3 bucket exists
        run: |
          aws s3api head-bucket --bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }}
          echo "Bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }} verified."
