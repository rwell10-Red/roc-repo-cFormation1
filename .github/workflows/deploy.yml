name: Deploy S3 Bucket via CloudFormation

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROC_AROLE_CFORMATION_S3 }}
          aws-region: us-east-1

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/stack.yaml

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name roc-cFormation1-s3 \
            --region us-east-1 \
            --no-fail-on-empty-changeset

      - name: Verify S3 bucket exists
        run: |
          aws s3api head-bucket --bucket roc-s3first-cloudformation
          echo "Bucket roc-s3first-cloudformation verified."
