name: Dev-Build-Test-Deploy S3 Bucket via CloudFormation
run-name: "Deploy: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.base.ref }}"

on:
  push:
    branches:
      - dev
  pull_request:
    types: [closed]
    branches:
      - stage
      - uat
      - prod

permissions:
  id-token: write
  contents: read

jobs:
  detect-environment:
    name: Detect Environment
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - name: Detect Target Environment
        id: detect
        run: |
          SOURCE="${{ github.event.pull_request.head.ref }}"
          TARGET="${{ github.event.pull_request.base.ref }}"

          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          elif [[ "$SOURCE" == "dev" && "$TARGET" == "stage" ]]; then
            echo "environment=stage" >> $GITHUB_OUTPUT
          elif [[ "$SOURCE" == "stage" && "$TARGET" == "uat" ]]; then
            echo "environment=uat" >> $GITHUB_OUTPUT
          elif [[ "$SOURCE" == "uat" && "$TARGET" == "prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "Invalid promotion path: $SOURCE → $TARGET"
            exit 1
          fi

  build:
    name: Build
    needs: detect-environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Lint CloudFormation template
        run: |
          pip install cfn-lint
          cfn-lint infra/stack.yaml

  deploy:
    name: Deploy (${{ needs.detect-environment.outputs.environment }})
    needs: [detect-environment, test]
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROC_AROLE_CFORMATION_S3 }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get AWS Account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Deploy CloudFormation stack
        id: deploy
        run: |
          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name ${{ vars.ENVIRONMENT }}-${{ vars.STACK_NAME }} \
            --region ${{ vars.AWS_REGION }} \
            --parameter-overrides Environment=${{ vars.ENVIRONMENT }} \
            --no-fail-on-empty-changeset

      - name: Verify rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "Deploy failed — verifying rollback..."

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.ENVIRONMENT }}-${{ vars.STACK_NAME }} \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "STACK_NOT_FOUND")

          echo "Stack status: $STACK_STATUS"

          if [[ "$STACK_STATUS" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
            echo "Rollback succeeded — stack is back to previous state"
            aws s3api head-bucket \
              --bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }}-${{ steps.account.outputs.id }}
            echo "Bucket still accessible after rollback"

          elif [[ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ]]; then
            echo "New stack creation failed — stack rolled back and is empty"
            echo "No resources exist. Stack needs manual deletion before retry."

          elif [[ "$STACK_STATUS" == "UPDATE_ROLLBACK_FAILED" ]]; then
            echo "CRITICAL: Rollback itself failed — manual intervention required"
            exit 1

          elif [[ "$STACK_STATUS" == "STACK_NOT_FOUND" ]]; then
            echo "Stack does not exist — nothing to verify"

          else
            echo "Unexpected status: $STACK_STATUS — investigate manually"
            exit 1
          fi

      - name: Verify S3 bucket exists
        run: |
          aws s3api head-bucket --bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }}-${{ steps.account.outputs.id }}
          echo "Bucket ${{ vars.ENVIRONMENT }}-s3-${{ vars.BUCKET_NAME }}-${{ steps.account.outputs.id }} verified."
