name: Deploy S3 Bucket via CloudFormation

on:
  push:
    branches:
      - main
      - dev
      - stage
      - uat

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || github.ref == 'refs/heads/dev' && 'dev' || github.ref == 'refs/heads/stage' && 'stage' || github.ref == 'refs/heads/uat' && 'uat' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy (${{ github.ref == 'refs/heads/main' && 'prod' || github.ref == 'refs/heads/dev' && 'dev' || github.ref == 'refs/heads/stage' && 'stage' || github.ref == 'refs/heads/uat' && 'uat' }})
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROC_AROLE_CFORMATION_S3 }}
          aws-region: us-east-1

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/stack.yaml

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name ${{ env.ENVIRONMENT }}-roc-cFormation1-s3 \
            --region us-east-1 \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --no-fail-on-empty-changeset

      - name: Verify S3 bucket exists
        run: |
          aws s3api head-bucket --bucket ${{ env.ENVIRONMENT }}-s3-roc-s3first-cloudformation
          echo "Bucket ${{ env.ENVIRONMENT }}-s3-roc-s3first-cloudformation verified."
